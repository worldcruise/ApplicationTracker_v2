project_id = "application-tracker-v2"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/callback?mode=recovery", "http://localhost:3000/account/update-password"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_confirmations = true

# Isolated local/CI mail sink only; hosted provider quotas are configured separately.
[auth.rate_limit]
email_sent = 1000

[auth.email.template.confirmation]
subject = "Confirm your ApplicationTracker account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "Your ApplicationTracker invitation"
content_path = "./supabase/templates/invite.html"

[analytics]
enabled = false

[edge_runtime]
enabled = false
