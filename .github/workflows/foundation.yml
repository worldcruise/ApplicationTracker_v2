name: Foundation checks
on:
  push:
    branches: [main, Dev, "codex/**"]
    paths: ["apps/**", "packages/**", "supabase/**", "scripts/**", "releases/**", "deploy/**", "render.yaml", ".node-version", "package*.json", "*.config.*", "tsconfig*.json", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
permissions:
  contents: read
jobs:
  clean-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.0'
          cache: npm
      - name: Install from committed lockfile without local env/build output
        run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify production build and release packaging with fictitious isolated configuration
        run: node scripts/test-release-build.mjs
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.0"
          cache: npm
      - run: npm ci
      - name: Start isolated Supabase (never links to hosted project)
        run: npm run db:start
      - run: npm run db:reset
      - run: npm run db:test
      - run: npm run check
      - run: npm run resume:verify
      - name: Install isolated Chromium for candidate browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Build and test production API with isolated synthetic Auth sessions
        run: npm run test:foundation:http
      - name: Report local service status on failure
        if: failure()
        run: docker ps -a --format '{{.Names}} {{.Status}}'
      - name: Retain synthetic workspace visual review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-workspace-ui
          path: .tools/ui-review/synthetic-*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Stop isolated stack
        if: always()
        run: npm run db:stop -- --no-backup

