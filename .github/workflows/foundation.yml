name: Foundation checks
on:
  push:
    branches: [main, Dev, "codex/**"]
    paths: ["apps/**", "packages/**", "supabase/**", "package*.json", "*.config.*", "tsconfig*.json", ".github/workflows/foundation.yml"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.0"
          cache: npm
      - run: npm ci
      - name: Start isolated Supabase (never links to hosted project)
        run: npm run db:start
      - run: npm run db:reset
      - run: npm run db:test
      - run: npm run check
      - name: Build and test production API with isolated synthetic Auth sessions
        run: npm run test:foundation:http
      - name: Report local service status on failure
        if: failure()
        run: docker ps -a --format '{{.Names}} {{.Status}}'
      - name: Stop isolated stack
        if: always()
        run: npm run db:stop -- --no-backup

